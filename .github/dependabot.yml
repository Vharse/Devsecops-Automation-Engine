version: 2
updates:
  # 1. GitHub Actions (Monday)
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Lagos"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      all-actions:
        patterns:
          - "*"

  # 2. Docker Base Images (Tuesday)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Africa/Lagos"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"
    groups:
      all-docker:
        patterns:
          - "*"

  # 3. Node.js / npm (Wednesday)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Africa/Lagos"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(npm)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      all-npm:
        patterns:
          - "*"

  # 4. Python / pip (Thursday)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "Africa/Lagos"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(pip)"
    labels:
      - "dependencies"
      - "python"
    groups:
      all-pip:
        patterns:
          - "*"
