name: "Dynamic Application Security Testing"

on:
  workflow_call:
    inputs:
      target_url:
        description: "Target URL to scan"
        required: false
        type: string
        default: "http://localhost:8080"
      zap_plan_path:
        description: "Path to ZAP Automation Framework plan"
        required: false
        type: string
        default: ".zap/zap-plan.yaml"
    secrets:
      DEFECTDOJO_URL:
        required: true
      DEFECTDOJO_TOKEN:
        required: true
      APP_USER:
        required: false
      APP_PASSWORD:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  dast-scan:
    name: "OWASP ZAP Automation Framework Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Build and Launch Target Application"
        run: |
          docker compose up -d --build
          echo "Waiting for target application at ${{ inputs.target_url }}..."
          timeout 60s bash -c 'until curl -s ${{ inputs.target_url }} > /dev/null; do sleep 2; done'
          echo "Target application is live."

      - name: "Create Report Directory"
        run: mkdir -p ${{ github.workspace }}/zap-results

      - name: "Run ZAP Automation Framework Plan"
        uses: zaproxy/action-baseline@v0.14.0
        env:
          APP_USER: ${{ secrets.APP_USER }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          cmd_options: '-autorun /zap/wrk/${{ inputs.zap_plan_path }}'
          fail_action: false

      - name: "Verify Scan Execution"
        run: |
          if [ -f "zap-report.json" ]; then
            echo "ZAP JSON report generated successfully."
          else
            echo "Error: ZAP report missing." && exit 1
          fi

      - name: "Ingest Findings into DefectDojo"
        if: always()
        run: |
          if [ -f "zap-report.json" ]; then
            echo "Uploading DAST findings to DefectDojo..."
            curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
              -F "active=true" \
              -F "verified=false" \
              -F "scan_type=ZAP Scan" \
              -F "minimum_severity=Low" \
              -F "engagement_name=CI/CD Pipeline" \
              -F "product_name=Product Security Gate" \
              -F "file=@zap-report.json"
          fi

      - name: "Tear Down Target Application"
        if: always()
        run: docker compose down -v
