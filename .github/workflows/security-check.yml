name: Security Check

on:
  push:
    branches: [main, dev, engine-updates]
  pull_request:
    branches: [main]

jobs:
  run-security-engine:
    uses: Vharse/Devsecops-Automation-Engine/.github/workflows/security-engine.yml@dev
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
      checks: write
    secrets: inherit
