name: Security Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-security-engine:
    uses: Vharse/Devsecops-Automation-Engine/.github/workflows/security-engine.yml@4cbc8cfe1e19d01d22fa80858f24be75ab568dab
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
      checks: write
    secrets: 
      inherit: true