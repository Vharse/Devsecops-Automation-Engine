name: Enterprise Security Orchestrator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-and-secrets:
    uses: Vharse/Devsecops-Automation-Engine/.github/workflows/sast-secrets.yml@e93b99bde3f1946e464970996fdc1e25ff55ad4f

    permissions:
      contents: read
      security-events: write
      actions: read
      checks: write
    secrets:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  container-and-sbom:
    uses: Vharse/Devsecops-Automation-Engine/.github/workflows/container-sbom.yml@e93b99bde3f1946e464970996fdc1e25ff55ad4f
    permissions:
      contents: read
      security-events: write
      actions: read
      checks: write

  iac-and-opa:
    uses: Vharse/Devsecops-Automation-Engine/.github/workflows/iac-opa.yml@e93b99bde3f1946e464970996fdc1e25ff55ad4f
    permissions:
      contents: read
      security-events: write
      actions: read
      checks: write

  scorecard-audit:
    uses: Vharse/Devsecops-Automation-Engine/.github/workflows/scorecard.yml@e93b99bde3f1946e464970996fdc1e25ff55ad4f
    permissions:
      contents: read
      security-events: write
      actions: read
      checks: write

  siem-telemetry:
    uses: Vharse/Devsecops-Automation-Engine/.github/workflows/siem-telemetry.yml@e93b99bde3f1946e464970996fdc1e25ff55ad4f
    permissions:
      contents: read
      actions: read
    secrets:
      ELASTIC_HOST: ${{ secrets.ELASTIC_HOST }}
      ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}

  defectdojo-ingestion:
    needs: [sast-and-secrets, container-and-sbom, iac-and-opa, scorecard-audit]
    # Enforces data ingestion even if scanners detect critical vulnerabilities and exit with failure codes
    if: always()
    uses: Vharse/Devsecops-Automation-Engine/.github/workflows/defectdojo-sync.yml@e93b99bde3f1946e464970996fdc1e25ff55ad4f
    permissions:
      contents: read
      actions: read
    secrets:
      DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
      DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}