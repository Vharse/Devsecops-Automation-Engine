name: "DevSecOps Security Engine"

on:
  workflow_call:
    secrets:
      ELASTIC_HOST:
        required: false
      ELASTIC_API_KEY:
        required: false
      SONAR_HOST:
        required: false
      SONAR_TOKEN:
        required: false
      AWS_ACCOUNT_ID:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      SEMGREP_APP_TOKEN:
        required: false
      DEFECTDOJO_URL:
        required: false
      DEFECTDOJO_API_KEY:
        required: false

jobs:
  sast-and-secrets:
    name: "SAST & Secret Scanning"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@828d098e98218671fc674f796245e317cb25e01f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep SAST Scan
        uses: semgrep/semgrep-action@1cd6ccb6b2ec62040c5fce07a21f72782ccfb395
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  sonarqube-sast:
    name: "SonarQube Code Quality & SAST"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@0f898f02930ed6b14dd06584c6eef9d6a31c5188
        with:
          args: >
            "-Dsonar.projectKey=Vharse_Devsecops-Automation-Engine"
            "-Dsonar.projectName=${{ github.event.repository.name || github.repository }}"
            "-Dsonar.organization=vharse"
            "-Dsonar.python.version=3.13"
            "-Dsonar.sources=."
            "-Dsonar.exclusions=**/node_modules/**,**/vendor/**,**/.venv/**"
            "-Dsonar.issue.ignore.multicriteria=e1"
            "-Dsonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6596"
            "-Dsonar.issue.ignore.multicriteria.e1.resourceKey=src/Dockerfile"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  container-sca-sbom:
    name: "SCA, Container Scan & SBOM"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      trivy-json-path: trivy-results.json
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false

      - name: Build Local Container Image
        run: |
          if [ -f "src/Dockerfile" ]; then
            [ -f "src/requirements.txt" ] || touch src/requirements.txt
            docker build -t local-test-image:latest -f src/Dockerfile src/
          elif [ -f "Dockerfile" ]; then
            [ -f "requirements.txt" ] || touch requirements.txt
            docker build -t local-test-image:latest .
          else
            echo "No Dockerfile found. Skipping container build."
          fi

      - name: Trivy Container & File System Scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87cd10
        with:
          scan-type: "fs"
          format: "json"
          output: "trivy-results.json"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Upload Trivy JSON Artifact
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b
        with:
          name: trivy-json-report
          path: trivy-results.json

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87cd10
        with:
          scan-type: "fs"
          format: "spdx-json"
          output: "sbom.spdx.json"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b
        with:
          name: sbom-spdx-report
          path: sbom.spdx.json

  iac-and-policy:
    name: "IaC & OPA Policy Enforcement"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false

      - name: Setup Open Policy Agent
        uses: open-policy-agent/setup-opa@38d72fa023e387f3ba93f5a11c1d93ce8d207ec1
        with:
          version: latest

      - name: Evaluate OPA Rego Policies
        run: |
          if [ -d "policies/opa" ]; then
            opa eval --data policies/opa/ "data"
          fi

  repo-scorecard:
    name: "OpenSSF Security Posture Evaluation"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@0864cf19026789058feabb7e87baa5f140aac736
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d
        with:
          sarif_file: scorecard-results.sarif

  defectdojo-ingestion:
    name: "Sync Vulnerabilities to DefectDojo"
    needs: [sast-and-secrets, sonarqube-sast, container-sca-sbom]
    runs-on: ubuntu-latest
    if: always()
    env:
      DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
      DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST: ${{ secrets.SONAR_HOST }}
    steps:
      - name: Download Trivy JSON Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: trivy-json-report

      - name: Push Trivy Report to DefectDojo
        if: ${{ env.DEFECTDOJO_URL != '' && env.DEFECTDOJO_API_KEY != '' }}
        run: |
          echo "Uploading Trivy JSON scan findings to DefectDojo..."
          RESPONSE=$(curl -s -S -g -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
            -H "accept: application/json" \
            -F "scan_type=Trivy Scan" \
            -F "file=@trivy-results.json" \
            -F "product_type_name=Devsecoops-Security-Engine" \
            -F "product_name=Devsecoops-Security-Engine" \
            -F "engagement_name=CI/CD Automated Scan" \
            -F "auto_create_context=true" \
            -F "verified=true" \
            -F "active=true")
          
          echo "DefectDojo Trivy Response:"
          echo "$RESPONSE"

      - name: Fetch and Push SonarQube Report to DefectDojo
        if: ${{ env.DEFECTDOJO_URL != '' && env.DEFECTDOJO_API_KEY != '' && env.SONAR_TOKEN != '' }}
        run: |
          echo "Fetching SonarQube issues..."
          HOST="${SONAR_HOST:-https://sonarcloud.io}"
          PROJECT_KEY="Vharse_Devsecops-Automation-Engine"
          
          curl -s -S -u "${SONAR_TOKEN}:" \
            "${HOST}/api/issues/search?projectKeys=${PROJECT_KEY}&resolved=false" \
            -o sonarqube-issues.json
            
          if [ -s sonarqube-issues.json ]; then
            echo "Uploading SonarQube issues to DefectDojo..."
            SQ_RESPONSE=$(curl -s -S -g -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
              -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
              -H "accept: application/json" \
              -F "scan_type=SonarQube Scan" \
              -F "file=@sonarqube-issues.json" \
              -F "product_type_name=Devsecoops-Security-Engine" \
              -F "product_name=Devsecoops-Security-Engine" \
              -F "engagement_name=CI/CD Automated Scan" \
              -F "auto_create_context=true" \
              -F "verified=true" \
              -F "active=true")
            
            echo "DefectDojo SonarQube Response:"
            echo "$SQ_RESPONSE"
          else
            echo "SonarQube issues report is empty or missing."
          fi

  siem-telemetry:
    name: "Ship Security Events to LOGIX SIEM"
    needs:
      [
        sast-and-secrets,
        container-sca-sbom,
        iac-and-policy,
        repo-scorecard,
        defectdojo-ingestion,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ELASTIC_HOST: ${{ secrets.ELASTIC_HOST }}
      ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Healthcheck & Ingest Telemetry
        continue-on-error: true
        run: |
          if [ -n "$ELASTIC_HOST" ]; then
            curl -s --connect-timeout 10 -X POST "$ELASTIC_HOST/devsecops-pipeline-logs/_doc" \
              -H "Authorization: ApiKey $ELASTIC_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"repository\": \"${{ github.repository }}\", \"actor\": \"${{ github.actor }}\", \"status\": \"Pipeline Run Completed\"}" || echo "SIEM Endpoint unreachable. Non-blocking skip."
          fi

      - name: Send Slack Notification
        if: always() && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*DevSecOps Security Gate Result*: ${{ github.repository }}\n*Triggered by*: `${{ github.actor }}`\n*Status*: `${{ job.status }}`"
            }