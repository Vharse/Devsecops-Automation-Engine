name: "Container SCA & SBOM Workflow"

on:
  workflow_call:
    secrets:
      DEFECTDOJO_URL:
        required: false
      DEFECTDOJO_API_KEY:
        required: false

jobs:
  container-sca-sbom:
    name: "SCA, Container Scan & SBOM"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      trivy-json-path: trivy-results.json
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build Local Container Image
        run: |
          if [ -f "src/Dockerfile" ]; then
            [ -f "src/requirements.txt" ] || touch src/requirements.txt
            docker build -t local-test-image:latest -f src/Dockerfile src/
          elif [ -f "Dockerfile" ]; then
            [ -f "requirements.txt" ] || touch requirements.txt
            docker build -t local-test-image:latest .
          else
            echo "No Dockerfile found. Skipping container build."
          fi

      - name: Trivy Container & File System Scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: "fs"
          format: "json"
          output: "trivy-results.json"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Upload Trivy JSON Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: trivy-json-report
          path: trivy-results.json

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: "fs"
          format: "spdx-json"
          output: "sbom.spdx.json"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom-spdx-report
          path: sbom.spdx.json

      - name: Upload Trivy Report to DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          python3 -c '
          import os
          import requests

          raw_url = os.environ.get("DEFECTDOJO_URL", "").strip()
          api_key = os.environ.get("DEFECTDOJO_API_KEY", "").strip()

          if not raw_url or not api_key:
              print("[-] DefectDojo credentials missing or empty. Skipping ingestion gracefully.")
              exit(0)

          url = raw_url.rstrip("/") + "/api/v2/import-scan/"
          headers = {
              "Authorization": "Token " + api_key,
              "accept": "application/json"
          }
          files = {
              "file": open("trivy-results.json", "rb")
          }
          data = {
              "scan_type": "Trivy Scan",
              "product_type_name": "Devsecoops-Security-Engine",
              "product_name": "Devsecoops-Security-Engine",
              "engagement_name": "CI/CD Automated Scan",
              "auto_create_context": "true",
              "verified": "true",
              "active": "true"
          }

          response = requests.post(url, headers=headers, data=data, files=files)
          print(f"Status Code: {response.status_code}")
          print(response.text)

          if response.status_code not in [200, 201]:
              exit(1)
          '
