name: "OpenSSF Scorecard Workflow"

on:
  workflow_call:

jobs:
  repo-scorecard:
    name: "OpenSSF Security Posture Evaluation"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v11d5960a326750d5838078e36cf38b85af677262

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif