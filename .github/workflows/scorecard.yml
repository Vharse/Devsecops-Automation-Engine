name: "OpenSSF Scorecard Workflow"

on:
  workflow_call:

jobs:
  repo-scorecard:
    name: "OpenSSF Security Posture Evaluation"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OpenSSF Scorecard
        uses: Vharse/Devsecops-Automation-Engine/.github/actions/scorecard-action@main
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: ${{ github.ref == 'refs/heads/main' }}

      - name: Upload SARIF to GitHub Security Tab
        uses: actions/codeql-action/init@main
        with:
          sarif_file: scorecard-results.sarif
