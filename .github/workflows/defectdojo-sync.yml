name: "DefectDojo Ingestion Workflow"

on:
  workflow_call:
    inputs:
      sast_job_needed:
        required: false
        type: boolean
        default: true
      container_job_needed:
        required: false
        type: boolean
        default: true
    secrets:
      DEFECTDOJO_URL:
        required: false
      DEFECTDOJO_API_KEY:
        required: false

jobs:
  defectdojo-ingestion:
    name: "Sync Vulnerabilities to DefectDojo"
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download Scan Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          path: all-reports

      - name: Push All Reports to DefectDojo
        if: ${{ secrets.DEFECTDOJO_URL != '\ && secrets.DEFECTDOJO_API_KEY != '\ }}
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          python3 -c '
          import os
          import requests

          raw_url = os.environ.get("DEFECTDOJO_URL", "").strip()
          api_key = os.environ.get("DEFECTDOJO_API_KEY", "").strip()

          if not raw_url or not api_key:
              print("[-] DefectDojo credentials missing or empty. Skipping ingestion gracefully.")
              exit(0)

          if not raw_url.startswith(("http://", "https://")):
              print(f"[-] Invalid DEFECTDOJO_URL format: {raw_url}. Must include protocol (http:// or https://).")
              exit(1)

          base_url = raw_url.rstrip("/") + "/api/v2/import-scan/"
          headers = {
              "Authorization": "Token " + api_key,
              "accept": "application/json"
          }

          scans = [
              {"path": "all-reports/trivy-json-report/trivy-results.json", "type": "Trivy Scan"},
              {"path": "all-reports/sast-secret-reports/semgrep-results.json", "type": "Semgrep JSON Report"},
              {"path": "all-reports/sast-secret-reports/gitleaks-results.json", "type": "Gitleaks Scan"}
          ]

          for scan in scans:
              file_path = scan["path"]
              scan_type = scan["type"]

              if not os.path.exists(file_path):
                  print(f"[-] Report not found: {file_path}, skipping...")
                  continue

              print(f"[+] Uploading {file_path} as {scan_type}...")
              with open(file_path, "rb") as f:
                  files = {"file": f}
                  data = {
                      "scan_type": scan_type,
                      "product_type_name": "Devsecoops-Security-Engine",
                      "product_name": "Devsecoops-Security-Engine",
                      "engagement_name": "CI/CD Automated Scan",
                      "auto_create_context": "true",
                      "verified": "true",
                      "active": "true"
                  }
                  response = requests.post(base_url, headers=headers, data=data, files=files)
                  print(f"    Status: {response.status_code}")
                  print(f"    Response: {response.text}")
          '

