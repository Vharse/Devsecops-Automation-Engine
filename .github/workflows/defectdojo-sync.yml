name: "DefectDojo Ingestion Workflow"

on:
  workflow_call:
    inputs:
      sast_job_needed:
        required: false
        type: boolean
        default: true
      container_job_needed:
        required: false
        type: boolean
        default: true
    secrets:
      DEFECTDOJO_URL:
        required: false
      DEFECTDOJO_API_KEY:
        required: false

jobs:
  defectdojo-ingestion:
    name: "Sync Vulnerabilities to DefectDojo"
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download Scan Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        continue-on-error: true
        with:
          path: all-reports

      - name: Push All Reports to DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        if: env.DEFECTDOJO_URL != '' && env.DEFECTDOJO_API_KEY != ''
        run: |
          python3 -c '
          import os
          import requests
          import time

          raw_url = os.environ.get("DEFECTDOJO_URL", "").strip()
          api_key = os.environ.get("DEFECTDOJO_API_KEY", "").strip()

          if not raw_url or not api_key:
              print("[-] DefectDojo credentials missing or empty. Skipping ingestion gracefully.")
              exit(0)

          if not raw_url.startswith(("http://", "https://")):
              print(f"[-] Invalid DEFECTDOJO_URL format: {raw_url}. Must include protocol (http:// or https://).")
              exit(0)

          base_url = raw_url.rstrip("/") + "/api/v2/import-scan/"
          headers = {
              "Authorization": "Token " + api_key,
              "accept": "application/json"
          }

          scans = [
              {"path": "all-reports/trivy-json-report/trivy-results.json", "type": "Trivy Scan"},
              {"path": "all-reports/sast-secret-reports/semgrep-results.json", "type": "Semgrep JSON Report"},
              {"path": "all-reports/sast-secret-reports/gitleaks-results.json", "type": "Gitleaks Scan"}
          ]

          for scan in scans:
              file_path = scan["path"]
              scan_type = scan["type"]

              if not os.path.exists(file_path):
                  print(f"[-] Report not found: {file_path}, skipping...")
                  continue

              print(f"[+] Uploading {file_path} as {scan_type}...")
              success = False
              for attempt in range(3):
                  try:
                      with open(file_path, "rb") as f:
                          files = {"file": f}
                          data = {
                              "scan_type": scan_type,
                              "product_type_name": "Devsecoops-Security-Engine",
                              "product_name": "Devsecoops-Security-Engine",
                              "engagement_name": "CI/CD Automated Scan",
                              "auto_create_context": "true",
                              "verified": "true",
                              "active": "true"
                          }
                          response = requests.post(base_url, headers=headers, data=data, files=files, timeout=120)
                          print(f"    Status: {response.status_code}")
                          print(f"    Response: {response.text}")
                          
                          if response.status_code in [200, 201]:
                              success = True
                              break
                          elif response.status_code == 502:
                              print(f"    [!] Cloudflare 502 Bad Gateway / Payload Limit encountered on attempt {attempt + 1}/3.")
                              if attempt < 2:
                                  print(f"    Retrying in 10s...")
                                  time.sleep(10)
                                  continue
                              else:
                                  print(f"    [!] Max retries reached for 502 error. Skipping ingestion gracefully to keep pipeline green.")
                                  success = True  # Treat as non-fatal to prevent pipeline failure
                                  break
                          else:
                              break
                  except requests.exceptions.RequestException as e:
                      print(f"[-] Connection error on attempt {attempt + 1}: {e}")
                      time.sleep(5)

              if not success:
                  print(f"[-] Warning: Failed to sync {scan_type} to DefectDojo after multiple attempts due to origin/gateway errors.")
          '
