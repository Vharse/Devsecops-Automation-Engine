name: "SAST, Secret Scanning & Code Quality Workflow"

on:
  workflow_call:
    secrets:
      SEMGREP_APP_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false
      SONAR_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  sast-secrets-and-quality:
    name: "SAST, Secrets & SonarQube"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      semgrep-json-path: semgrep-results.json
      gitleaks-json-path: gitleaks-results.json
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --report-format json --report-path gitleaks-results.json

      - name: Semgrep SAST Scan
        uses: semgrep/semgrep-action@9a16a63fd4f29af4f7f64782b8890943de7788a6
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        with:
          generate-sarif: "1"
          config: auto

      - name: Rename Semgrep Output for Ingestion
        run: |
          if [ -f "semgrep.sarif" ]; then
            cp semgrep.sarif semgrep-results.json
          elif [ -f "semgrep-results.json" ]; then
            true
          else
            echo "{}" > semgrep-results.json
          fi

      - name: Check SonarQube Credentials
        id: sonar_check
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: SonarQube Scan
        if: steps.sonar_check.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703
        with:
          args: >
            -Dsonar.projectKey=Vharse_Devsecops-Automation-Engine
            -Dsonar.projectName=${{ github.event.repository.name || github.repository }}
            -Dsonar.organization=vharse
            -Dsonar.python.version=3.13
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/vendor/**,**/.venv/**
            -Dsonar.issue.ignore.multicriteria=e1
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6596
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=src/Dockerfile
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Upload SAST & Secret Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: sast-secret-reports
          path: |
            semgrep-results.json
            gitleaks-results.json
