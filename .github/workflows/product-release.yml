name: "Product Release"

on:
  push:
    tags:
      - 'v*.*.*'

# Global least-privilege token restriction required for OpenSSF Scorecard compliance
permissions:
  contents: read

# Prevent race conditions while guaranteeing release builds finish completely
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-sign:
    name: "Build, Sign & Publish Artifacts"
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # Required for GitHub Release creation & tagging
      packages: write # Required for GHCR push
      id-token: write # Required for Cosign keyless (OIDC) signing
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and Push Docker Image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Cryptographically Sign Image (Keyless OIDC)
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build-and-push.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: "ghcr.io/${{ github.repository }}@${{ steps.build-and-push.outputs.digest }}"
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        run: |
          cosign attest --yes --predicate-type spdxjson --predicate sbom.spdx.json "ghcr.io/${{ github.repository }}@${{ steps.build-and-push.outputs.digest }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.spdx.json
          generate_release_notes: true
